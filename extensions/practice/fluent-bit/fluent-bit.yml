service:
  flush: 1
  daemon: no
  log_level: info
pipeline:
  inputs:
    - name: tail
      path: ./test-logs/*.log
      read_from_head: true
    - name: tcp
      listen: 0.0.0.0
      port: 5170
      chunk_size: 32
      buffer_size: 64
      format: none

  outputs:
    - name: stdout
      match: "*"

    - name: tcp
      match: "*"
      host: host.docker.internal
      port: 19002
      format: json_lines
